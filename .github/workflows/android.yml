name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check the model file is in the repo
        run: test -s public/models/u2netp.onnx
      - run: npm install
      - name: Type check (reports errors, does not block the APK)
        run: npm run typecheck
        continue-on-error: true
      - run: npm run build
      - name: Create Android project
        run: test -f android/gradlew || npx cap add android
      - name: Add the MediaStore plugin (native code)
        run: |
          DIR=$(dirname "$(find android/app/src/main/java -name 'MainActivity.*' | head -n 1)")
          echo "Package dir: $DIR"
          rm -f "$DIR"/MainActivity.kt "$DIR"/MainActivity.java
          cp native/MainActivity.java native/MediaSaverPlugin.java "$DIR"/
          ls "$DIR"
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

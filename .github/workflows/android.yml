name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Get the background-removal model (4.6 MB) unless it is already in the repo
        run: |
          mkdir -p public/models
          if [ ! -s public/models/u2netp.onnx ]; then
            curl -fL --retry 3 -o public/models/u2netp.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          fi
          echo "8e83ca70e441ab06c318d82300c84806  public/models/u2netp.onnx" | md5sum -c -
      - name: Download the offline Arabic OCR language pack (Arabic, Persian and Urdu)
        run: |
          mkdir -p public/models
          cd public/models
          [ -s ocr_det.onnx ] || curl -fL --retry 3 --retry-all-errors -o ocr_det.onnx https://huggingface.co/monkt/paddleocr-onnx/resolve/main/detection/v3/det.onnx
          [ -s ocr_rec.onnx ] || curl -fL --retry 3 --retry-all-errors -o ocr_rec.onnx https://huggingface.co/monkt/paddleocr-onnx/resolve/main/languages/arabic/rec.onnx
          [ -s ocr_dict.txt ] || curl -fL --retry 3 --retry-all-errors -o ocr_dict.txt https://huggingface.co/monkt/paddleocr-onnx/resolve/main/languages/arabic/dict.txt
          test "$(stat -c%s ocr_det.onnx)" -gt 100000
          test "$(stat -c%s ocr_rec.onnx)" -gt 100000
          test "$(wc -l < ocr_dict.txt)" -gt 50
          printf '{"model":"PP-OCR Arabic","languages":["ar","fa","ur"],"offline":true}\n' > ocr-languages.json
          ls -lh ocr_det.onnx ocr_rec.onnx ocr_dict.txt ocr-languages.json
      - run: npm install
      - name: Type check (reports errors, does not block the APK)
        run: npm run typecheck
        continue-on-error: true
      - run: npm run build
      - name: Verify OCR models are packaged into the app
        run: |
          test -s public/models/ocr_det.onnx
          test -s public/models/ocr_rec.onnx
          test -s public/models/ocr_dict.txt
          test -s dist/models/ocr_det.onnx
          test -s dist/models/ocr_rec.onnx
          test -s dist/models/ocr_dict.txt
          ls -lh dist/models/ocr_det.onnx dist/models/ocr_rec.onnx dist/models/ocr_dict.txt
      - name: Create Android project
        run: test -f android/gradlew || npx cap add android
      - name: Add the MediaStore plugin (native code)
        run: |
          DIR=$(dirname "$(find android/app/src/main/java -name 'MainActivity.*' | head -n 1)")
          echo "Package dir: $DIR"
          rm -f "$DIR"/MainActivity.kt "$DIR"/MainActivity.java
          cp native/MainActivity.java native/MediaSaverPlugin.java "$DIR"/
          ls "$DIR"
      - run: npx cap sync android
      - name: Verify OCR models are inside Android assets
        run: |
          ASSETS=android/app/src/main/assets/public/models
          test -s "$ASSETS/ocr_det.onnx"
          test -s "$ASSETS/ocr_rec.onnx"
          test -s "$ASSETS/ocr_dict.txt"
          ls -lh "$ASSETS/ocr_det.onnx" "$ASSETS/ocr_rec.onnx" "$ASSETS/ocr_dict.txt"
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

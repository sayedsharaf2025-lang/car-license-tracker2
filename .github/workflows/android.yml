name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Get the background-removal model (4.6 MB) unless it is already in the repo
        run: |
          mkdir -p public/models
          if [ ! -s public/models/u2netp.onnx ]; then
            curl -fL --retry 3 -o public/models/u2netp.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          fi
          echo "8e83ca70e441ab06c318d82300c84806  public/models/u2netp.onnx" | md5sum -c -
      - name: Get the text-reading models (about 10 MB, optional - the app still builds without them)
        continue-on-error: true
        run: |
          cd public/models
          [ -s ocr_det.onnx ]  || curl -fL --retry 3 -o ocr_det.onnx  https://huggingface.co/monkt/paddleocr-onnx/resolve/main/detection/v3/det.onnx
          [ -s ocr_rec.onnx ]  || curl -fL --retry 3 -o ocr_rec.onnx  https://huggingface.co/monkt/paddleocr-onnx/resolve/main/languages/arabic/rec.onnx
          [ -s ocr_dict.txt ]  || curl -fL --retry 3 -o ocr_dict.txt  https://huggingface.co/monkt/paddleocr-onnx/resolve/main/languages/arabic/dict.txt
          ls -l
      - run: npm install
      - name: Type check (reports errors, does not block the APK)
        run: npm run typecheck
        continue-on-error: true
      - run: npm run build
      - name: Create Android project
        run: test -f android/gradlew || npx cap add android
      - name: Add the MediaStore plugin (native code)
        run: |
          DIR=$(dirname "$(find android/app/src/main/java -name 'MainActivity.*' | head -n 1)")
          echo "Package dir: $DIR"
          rm -f "$DIR"/MainActivity.kt "$DIR"/MainActivity.java
          cp native/MainActivity.java native/MediaSaverPlugin.java "$DIR"/
          ls "$DIR"
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
